<script>
function createEngine(newId){
 let called=[],round=1,open=true,places=3,prizes=['','',''],jk=0,jn=[],pt=null;
 const players=new Map(),subs=new Set();
 const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const newCard=()=>shuffle(Array.from({length:30},(_,i)=>i+1)).slice(0,16);
 const left=p=>p.card.filter(n=>!called.includes(n)).length;
 const doneAt=p=>left(p)?0:Math.max(...p.card.map(n=>called.indexOf(n)+1));
 function wins(){const f=[...players.values()].map(p=>({p,d:doneAt(p)})).filter(x=>x.d).sort((a,b)=>a.d-b.d),w=[];let k=0;
  for(const x of f){const l=w[w.length-1];if(l&&l.draw===x.d)l.names.push(x.p.name);else w.push({place:k+1,draw:x.d,names:[x.p.name]});k++}
  return{w,total:k}}
 const isOver=()=>{const{total}=wins();return called.length>=30||(total>0&&total>=Math.min(places,players.size))};
 function snap(){const{w}=wins(),pl=[...players.values()],dist=Array(17).fill(0);pl.forEach(p=>dist[left(p)]++);
  return{called,round,n:pl.length,open:open&&called.length===0,places,prizes,over:isOver()&&called.length>0,
   win:w.filter(g=>g.place<=places).map(g=>({...g,prize:prizes[g.place-1]||''})),dist,
   top:pl.map(p=>({name:p.name,left:left(p)})).sort((a,b)=>a.left-b.left).slice(0,10),jn}}
 const go=()=>{pt=null;const s=JSON.stringify(snap());subs.forEach(f=>f(s))};
 const push=now=>{if(now){clearTimeout(pt);go()}else if(!pt)pt=setTimeout(go,250)};
 const info=p=>({id:p.id,name:p.name,card:p.card});
 const clean=s=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,20);
 const uniq=(name,id)=>{let n=name,i=2;while([...players.values()].some(p=>p.id!==id&&p.name.toLowerCase()===n.toLowerCase()))n=name.slice(0,16)+' ('+i+++')';return n};
 function api(m,p,q,b,host){b=b||{};
  if(p==='/join'&&m==='POST'){let pl=players.get(b.id);
   if(!pl){if(called.length||!open)return[403,{error:'closed'}];const name=clean(b.name);if(!name)return[400,{error:'name'}];if(players.size>=500)return[403,{error:'full'}];
    pl={id:newId(),name:uniq(name),card:newCard()};players.set(pl.id,pl);jn=[...jn,{k:++jk,name:pl.name}].slice(-5);push()}
   return[200,info(pl)]}
  if(p==='/me'){const pl=players.get(q.id);return pl?[200,info(pl)]:[404,{}]}
  if(p==='/rename'&&m==='POST'){const pl=players.get(b.id),n=clean(b.name);if(!pl||!n)return[400,{}];pl.name=uniq(n,pl.id);push();return[200,info(pl)]}
  if(m==='POST'&&['/draw','/reset','/config'].includes(p)){if(!host)return[403,{error:'key'}];
   if(p==='/draw'){const rest=[];for(let n=1;n<=30;n++)if(!called.includes(n))rest.push(n);
    if(isOver()||!rest.length)return[409,{}];const n=rest[Math.floor(Math.random()*rest.length)];called.push(n);push(true);return[200,{n}]}
   if(p==='/reset'){called=[];round++;open=true;players.forEach(x=>x.card=newCard());push(true);return[200,{}]}
   if(Array.isArray(b.prizes))prizes=[0,1,2].map(i=>String(b.prizes[i]||'').slice(0,40));
   if([1,2,3].includes(+b.places))places=+b.places;if(typeof b.open==='boolean')open=b.open;push();return[200,{}]}
  return null}
 return{api,snap,subs}}

\"><h2>🏆 PREMIOS Y GANADORES<\/h2><div id=\"pod2\"><\/div><\/div>\n    <div class=\"panel fl\"><h2>QUIÉN VA GANANDO<\/h2><div id=\"top2\" class=\"sc\"><\/div><\/div>\n   <\/div><\/div>\n <\/div>\n<\/section>\n<div id=\"win\" class=\"ov\" hidden><div class=\"panel\"><h2 id=\"wt\">🏆 ¡BINGO!<\/h2><div id=\"wb\"><\/div><div class=\"bar\"><button id=\"wc\" style=\"background:#555\">Cerrar<\/button><\/div><\/div><\/div>\n<script>\nconst $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst mem={},st={g:k=>{if(window.__DEMO)return mem[k]||null;try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},s:(k,v)=>{if(window.__DEMO){mem[k]=v;return}try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};\nconst HOST=window.__HOST!==undefined?window.__HOST:location.pathname==='/host',key=window.__KEY!==undefined?window.__KEY:(new URLSearchParams(location.search).get('key')||'');\nlet S={called:[],round:0,win:[],n:0,open:true,over:false,prizes:['','',''],places:3,top:[],dist:[],jn:[]},me=null,busy=false,hide=false,AC,snd=st.g('snd')!=='0',voz=st.g('voz')!=='0',seen=-1,tt;\n/* sonido */\nfunction tone(f,d,t,v,w){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(w||0);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.05)}catch(e){}}\nconst ding=()=>{tone(784,.25,'triangle',.2);tone(1175,.45,'triangle',.18,.12)},near=()=>[880,988,1175].forEach((f,i)=>tone(f,.18,'square',.07,i*.1)),\n fan=()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.2,i*.16));[523,659,784].forEach(f=>tone(f,1.2,'sine',.12,1.15))},\n roll=()=>{for(let i=0;i<13;i++)tone(300+i*35,.06,'square',.05,i*.075)},hi=()=>{tone(660,.12,'sine',.15);tone(990,.2,'sine',.15,.1)};\nfunction say(t){if(!voz||!snd||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}\nfunction sbtn(){const b=$(HOST?'sn':'sp');b.textContent=snd?'🔊':'🔇';if(HOST)$('vz').style.opacity=voz?1:.4}\nfunction tg(){snd=!snd;st.s('snd',snd?'1':'0');sbtn();ding()}\n/* tablero/cartón: casillas sobre la imagen */\nfunction tile(par,n,x,y,w,h,W,H,gx,gy,gs){const t=document.createElement('div');t.className='t';t.style.cssText='left:'+x/W*100+'%;top:'+y/H*100+'%;width:'+w/W*100+'%;height:'+h/H*100+'%';t.textContent=n;\n const g=document.createElement('i');g.className='g';g.style.cssText='left:'+gx*100+'%;top:'+gy*100+'%;width:'+gs*100+'%';t.appendChild(g);par.appendChild(t);return t}\n/* vistas comunes */\nconst MED=['🥇','🥈','🥉'];\nconst chips=(a,k)=>a.length?a.slice().reverse().slice(0,k||99).map((n,i)=>'<div class=\"nb'+(i?'':' new')+'\">'+n+'<\/div>').join(''):'<span style=\"opacity:.6;font-size:12px\">Aún no hay números<\/span>';\nfunction podium(){const w=S.win,tot=w.reduce((a,g)=>a+g.names.length,0);\n let h=w.map(g=>'<div class=\"rk g'+g.place+'\"><span class=\"med\">'+MED[g.place-1]+'<\/span><div class=\"nmx\"><b>'+g.names.map(esc).join(' · ')+'<\/b><small>'+(g.names.length>1?'¡Empate! · ':'')+'completó con el '+(S.called[g.draw-1]||'')+(g.prize?' · 🎁 '+esc(g.prize):'')+'<\/small><\/div><\/div>').join('');\n for(let k=tot+1;k<=S.places;k++)h+='<div class=\"rk em\"><span class=\"med\">'+MED[k-1]+'<\/span><div class=\"nmx\">Por definir'+(S.prizes[k-1]?' · 🎁 '+esc(S.prizes[k-1]):'')+'<\/div><\/div>';return h}\nfunction board(mine){if(!S.top.length)return'<div style=\"text-align:center;opacity:.6;font-size:13px\">Esperando participantes…<\/div>';let p=0,prev=-1;\n return S.top.map((t,i)=>{if(t.left!==prev){p=i+1;prev=t.left}return'<div class=\"rk'+(mine&&t.name===mine?' me':'')+'\"><span class=\"pos\">'+p+'<\/span><div class=\"nmx\"><b>'+esc(t.name)+'<\/b><\/div><div class=\"pg\"><i style=\"width:'+(16-t.left)/16*100+'%\"><\/i><\/div><span style=\"font-size:11px;min-width:58px;text-align:right\">'+(t.left?'faltan '+t.left:'¡completo!')+'<\/span><\/div>'}).join('')}\nfunction winHtml(){return S.win.map(g=>'<div class=\"rk g'+g.place+'\"><span class=\"med\">'+MED[g.place-1]+'<\/span><div class=\"nmx\"><b style=\"font-size:20px\">'+g.names.map(esc).join(' · ')+'<\/b>'+(g.names.length>1?'<small>¡Empate!<\/small>':'')+(g.prize?'<small>🎁 '+esc(g.prize)+'<\/small>':'')+'<\/div><\/div>').join('')}\nfunction showWin(){const mine=me&&S.win.some(g=>g.names.includes(me.name));$('wt').textContent=mine?'🎉 ¡GANASTE!':'🏆 ¡FIN DEL BINGO!';$('wb').innerHTML=winHtml();$('win').hidden=false;fan()}\n$('wc').onclick=()=>{$('win').hidden=true};\n/* conexión */\nconst es=new EventSource('/events');\nes.onopen=()=>{$('st').textContent='🟢 En vivo';if(!HOST&&me)fetch('/me?id='+me.id).then(r=>{if(r.status===404){me=null;st.s('bid','');$('game').hidden=true;$('join').hidden=false;$('jm').textContent='La partida se reinició. Vuelve a escribir tu nombre.'}else return r.json().then(m=>{me=m;buildCard();renderPlay()})}).catch(()=>{})};\nes.onerror=()=>{$('st').textContent='🔴 Reconectando…'};\nes.onmessage=e=>{const p=S;S=JSON.parse(e.data);HOST?hostState(p):playState(p)};\nif(HOST){\n $('host').hidden=false;$('lnk').value=window.__LINK||location.origin+'/';sbtn();\n const XS=[62,220,378,536,694],YS=[385,537,690,842,994,1147],tl=[],pz=[...document.querySelectorAll('.pz')];\n for(let n=1;n<=30;n++){const r=Math.floor((n-1)/5),c=(n-1)%5;tl[n]=tile($('board'),n,XS[c],YS[r],145,137,896,1352,.83,.146,.2)}\n const api=(p,b)=>fetch(p+'?key='+encodeURIComponent(key),{method:'POST',body:JSON.stringify(b||{})});\n let ct;const cfg=()=>{clearTimeout(ct);ct=setTimeout(()=>api('/config',{prizes:pz.map(i=>i.value),places:+$('pl').value}),400)};\n pz.forEach(i=>{i.oninput=cfg});$('pl').onchange=cfg;\n function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),4500)}\n function renderHost(){const c=hide?S.called.slice(0,-1):S.called,lastN=c[c.length-1];\n  for(let n=1;n<=30;n++)tl[n].className='t'+(c.includes(n)?' m':'')+(n===lastN?' last':'');\n  $('last').textContent=c.length?lastN:'–';\n  $('stat').textContent=S.n+(S.n===1?' participante':' participantes')+(S.open?' · abierta':' · cerrada')+' · '+S.called.length+'/30';\n  pz.forEach((i,k)=>{if(document.activeElement!==i)i.value=S.prizes[k]||''});if(document.activeElement!==$('pl'))$('pl').value=S.places;\n  $('hn').textContent=c.length?c.length+' números sacados':'';$('hist').innerHTML=chips(c);\n  $('pod').innerHTML=busy?'':podium();$('top').innerHTML=board();$('go').disabled=busy||S.over}\n function hostState(p){\n  const mk=Math.max(0,...S.jn.map(j=>j.k));if(seen<0)seen=mk;else{const nw=S.jn.filter(j=>j.k>seen);if(nw.length){seen=mk;toast('👋 '+nw.map(j=>j.name).join(', ')+(nw.length>1?' entraron':' entró')+' como participante');hi()}}\n  const n=S.called.length===p.called.length+1?S.called[S.called.length-1]:0;\n  if(n){busy=true;hide=true;renderHost();const fw=$('fw'),ball=$('ball');fw.classList.remove('shake');ball.classList.remove('go');void fw.offsetWidth;fw.classList.add('shake');ball.classList.add('go');roll();\n   const fl=setInterval(()=>{ball.textContent=1+Math.floor(Math.random()*30)},70);\n   setTimeout(()=>{clearInterval(fl);ball.textContent=n;hide=false;ding();say('Número '+n);renderHost()},1000);\n   setTimeout(()=>{busy=false;renderHost();if(S.over)showWin()},2400)}\n  else{renderHost();if(S.over&&!busy&&!p.over)showWin()}}\n $('go').onclick=()=>{$('go').disabled=true;api('/draw').then(r=>{if(r.status===403)alert('Clave incorrecta: abre /host?key=TU_CLAVE');else if(!r.ok)renderHost()}).catch(()=>{$('go').disabled=false;alert('Sin conexión con el servidor')})};\n $('rs').onclick=()=>{if(confirm('¿Empezar una nueva partida? Todos recibirán plantilla nueva.')){$('win').hidden=true;api('/reset')}};\n $('op').onclick=()=>{api('/config',{open:!S.open})};\n $('sn').onclick=tg;$('vz').onclick=()=>{voz=!voz;st.s('voz',voz?'1':'0');sbtn();say('Voz activada')};\n $('cp').onclick=()=>{const t=$('lnk').value;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{$('lnk').select();document.execCommand('copy')}).then(()=>{$('cp').textContent='✅ Copiado'},()=>{});setTimeout(()=>{$('cp').textContent='📋 Copiar'},2000)};\n if(!key)$('stat').textContent='Falta la clave: abre /host?key=TU_CLAVE';\n}else{\n $('play').hidden=false;sbtn();$('sp').onclick=tg;let ct=[];\n const XS=[78,308,535,765],YS=[335,490,645,810];\n function buildCard(){const cw=$('cw');cw.innerHTML='';ct=[];me.card.forEach((n,i)=>{ct.push([n,tile(cw,n,XS[i%4],YS[Math.floor(i/4)],192,142,1024,1024,.87,.155,.26)])})}\n const save=m=>{me=m;$('rn').hidden=false;st.s('bid',m.id);$('join').hidden=true;$('game').hidden=false;buildCard();renderPlay()};\n const join=async()=>{ding();const nm=$('nm').value.trim();if(!nm){$('jm').textContent='Escribe tu nombre.';return}\n  $('jb').disabled=true;$('jm').textContent='Entrando…';\n  try{const r=await fetch('/join',{method:'POST',body:JSON.stringify({name:nm,id:st.g('bid')})});\n   if(r.ok)save(await r.json());else $('jm').textContent=r.status===403?'La inscripción está cerrada (la partida ya empezó). Entra en la siguiente ronda.':'Escribe tu nombre.'}\n  catch(e){$('jm').textContent='No se pudo conectar. Espera unos segundos y vuelve a intentar.'}\n  $('jb').disabled=false};\n $('jb').onclick=join;$('nm').onkeydown=e=>{if(e.key==='Enter')join()};\n $('rn').onclick=()=>{const n=(prompt('Nuevo nombre',me.name)||'').trim();if(n)fetch('/rename',{method:'POST',body:JSON.stringify({id:me.id,name:n})}).then(r=>r.json()).then(m=>{me=m;renderPlay()})};\n const id=st.g('bid');if(id)fetch('/me?id='+id).then(r=>r.ok&&r.json()).then(m=>{if(m)save(m)}).catch(()=>{});\n function renderPlay(){if(!me)return;const c=S.called,l=me.card.filter(n=>!c.includes(n)).length,last=c[c.length-1];\n  ct.forEach(([n,t])=>{t.className='t'+(c.includes(n)?' m':'')+(n===last?' last':'')});\n    $('lp').textContent=c.length?last:'–';$('pf').textContent=l?'Te faltan '+l+' números':'¡Plantilla completa!';\n  const d=S.dist||[];let pos=1;for(let i=0;i<l;i++)pos+=d[i]||0;$('pp').textContent=me.name+(S.n?' · puesto '+pos+' de '+S.n:'');\n  $('pod2').innerHTML=podium();$('top2').innerHTML=board(me.name);$('hist2').innerHTML=chips(c,12)}\n function playState(p){if(p.round&&S.round!==p.round&&me)fetch('/me?id='+me.id).then(r=>r.json()).then(m=>{me=m;buildCard();$('win').hidden=true;renderPlay()}).catch(()=>{});\n  const grew=S.called.length>p.called.length;renderPlay();\n  if(grew&&me){const l=me.card.filter(n=>!S.called.includes(n)).length;if(l===1)near();else ding()}\n  if(S.over&&!p.over&&p.round===S.round)setTimeout(showWin,600)}\n}\n<\/script><\/body><\/html>\n";
const KEY='demo',PMODE=location.hash==='#participante',TAB=Math.random().toString(36).slice(2);
const $=id=>document.getElementById(id),LINK=location.href.split('#')[0]+'#participante';
let E=null,bc=null,transport=null,frames=[],active=0,side=false,auto=null,nt;
function SHIM(c){
 window.__DEMO=1;window.__HOST=c.host;window.__KEY=c.key;window.__LINK=c.link;
 window.confirm=()=>true;window.prompt=(m,d)=>(d||'')+' ★';window.alert=m=>parent.postMessage({bingo:1,t:'alert',m:String(m)},'*');
 let n=0;const pend={},es=[];
 addEventListener('message',e=>{const d=e.data;if(!d||!d.bingo)return;if(d.t==='res'){const p=pend[d.id];if(p){delete pend[d.id];p(d)}}else if(d.t==='ev')es.forEach(s=>s._ev(d.data))});
 window.fetch=(u,o)=>new Promise(ok=>{const id=++n;pend[id]=d=>ok({ok:d.status>=200&&d.status<300,status:d.status,json:()=>Promise.resolve(d.json)});
  parent.postMessage({bingo:1,t:'fetch',id,method:(o&&o.method)||'GET',url:String(u),body:(o&&o.body)||null},'*')});
 window.EventSource=function(u){const s=this;es.push(s);s._ev=data=>{if(s.onmessage)s.onmessage({data})};setTimeout(()=>{if(s.onopen)s.onopen();parent.postMessage({bingo:1,t:'sub'},'*')},0)};
}
const srcdoc=host=>INDEX.replace('<head>','<head><script>('+SHIM.toString()+')('+JSON.stringify({host,key:host?KEY:'',link:LINK})+')<\/script>');
function note(m){const n=$('note');n.textContent=m;n.style.opacity=1;clearTimeout(nt);nt=setTimeout(()=>{n.style.opacity=0},4500)}
function callEngine(m,p,q,b){const before=E.snap().n,r=E.api(m,p,q,b,q.key===KEY)||[404,{}];
 if(p==='/join'&&r[0]===200&&E.snap().n>before)note('👋 '+r[1].name+' entró como participante');return r}
function mkTransport(){
 if(E)return{call:(m,p,q,b)=>Promise.resolve(callEngine(m,p,q,b)),sub:cb=>{E.subs.add(cb);cb(JSON.stringify(E.snap()))}};
 const w={},subs=new Set();bc.onmessage=e=>{const d=e.data;if(d.to!==TAB)return;if(d.t==='res'&&w[d.id]){w[d.id]([d.status,d.json]);delete w[d.id]}if(d.t==='ev')subs.forEach(f=>f(d.data))};
 let k=0;return{call:(m,p,q,b)=>new Promise(ok=>{const id=++k;w[id]=ok;bc.postMessage({t:'req',id,from:TAB,m,p,q,b})}),sub:cb=>{subs.add(cb);bc.postMessage({t:'sub',from:TAB})}}}
function mkFrame(host){const el=document.createElement('iframe');el.className='fr'+(host?' host':'');el.setAttribute('sandbox','allow-scripts');el.srcdoc=srcdoc(host);$('stage').appendChild(el);
 const f={el,host,name:host?'🎙 Anfitrión':'👤 Participante '+(frames.filter(x=>!x.host).length+1)};frames.push(f);layout();return f}
function layout(){const tabs=$('tabs');tabs.innerHTML='';
 frames.forEach((f,i)=>{const b=document.createElement('button');b.className='tb'+(i===active?' on':'');b.textContent=f.name;b.onclick=()=>{active=i;layout()};tabs.appendChild(b)});
 const part=frames.findIndex((f,i)=>!f.host&&(i===active||frames[active].host)),vis=new Set([active]);
 if(side&&frames.length>1){vis.add(frames.findIndex(f=>f.host));if(part>=0)vis.add(part)}
 frames.forEach((f,i)=>f.el.classList.toggle('show',vis.has(i)));$('bs').textContent=side?'Pestañas':'Lado a lado'}
addEventListener('message',e=>{const d=e.data;if(!d||!d.bingo)return;const f=frames.find(x=>x.el.contentWindow===e.source);if(!f)return;
 if(d.t==='alert')note(d.m);
 if(d.t==='sub')transport.sub(s=>f.el.contentWindow.postMessage({bingo:1,t:'ev',data:s},'*'));
 if(d.t==='fetch'){const u=new URL(d.url,'http://x');let b={};try{b=JSON.parse(d.body||'{}')}catch(x){}
  transport.call(d.method,u.pathname,Object.fromEntries(u.searchParams),b).then(([status,json])=>{
   if((u.pathname==='/join'||u.pathname==='/rename')&&status===200&&!f.host){f.name='👤 '+json.name;layout()}
   e.source.postMessage({bingo:1,t:'res',id:d.id,status,json},'*')})}});
function startHost(){
 E=createEngine(()=>Math.random().toString(36).slice(2,12));transport=mkTransport();
 try{bc=new BroadcastChannel('bingo-demo');bc.onmessage=e=>{const d=e.data;
  if(d.t==='ping')bc.postMessage({t:'pong'});
  if(d.t==='req'){const r=callEngine(d.m,d.p,d.q,d.b);bc.postMessage({t:'res',to:d.from,id:d.id,status:r[0],json:r[1]})}
  if(d.t==='sub'){E.subs.add(s=>bc.postMessage({t:'ev',to:d.from,data:s}));bc.postMessage({t:'ev',to:d.from,data:JSON.stringify(E.snap())})}}}catch(x){}}
const BOTS=['Luna','Mateo','Sofía','Diego','Valeria','Camilo','Isabela','Andrés','Paula','Sebas','Nico','Mía'];
function draw(){const r=callEngine('POST','/draw',{key:KEY},{});if(r[0]!==200)stopAuto();return r}
function stopAuto(){clearInterval(auto);auto=null;$('ba').textContent='▶ Auto-sortear'}
function reset(){stopAuto();callEngine('POST','/reset',{key:KEY},{});note('↺ Nueva partida: inscripción abierta')}
if(PMODE){
 $('top').style.display='none';
 try{bc=new BroadcastChannel('bingo-demo')}catch(x){}
 let ok=false;const go=()=>{if(!ok){startHost();$('bm').textContent='⚠️ No encontré al anfitrión en otra pestaña de este navegador. Funciono sola, como demostración.';$('bn').style.display='flex';$('bd').onclick=draw;$('bq').onclick=reset}
  else{transport=mkTransport()}mkFrame(false)};
 if(bc){const h=e=>{if(e.data&&e.data.t==='pong')ok=true};bc.addEventListener('message',h);bc.postMessage({t:'ping'});setTimeout(()=>{bc.removeEventListener('message',h);go()},900)}else go();
}else{
 startHost();mkFrame(true);mkFrame(false);
 $('bp').onclick=()=>{const f=mkFrame(false);active=frames.indexOf(f);layout()};
 $('bb').onclick=()=>{let n=0;BOTS.slice().sort(()=>Math.random()-.5).slice(0,5).forEach(x=>{if(E.api('POST','/join',{},{name:x})[0]===200)n++});note(n?'🤖 '+n+' bots entraron':'Inscripción cerrada: pulsa ↺ Nueva partida')};
 $('ba').onclick=()=>{if(auto){stopAuto();return}$('ba').textContent='⏸ Parar';draw();auto=setInterval(draw,3600)};
 $('br').onclick=reset;$('bs').onclick=()=>{side=!side;layout()};
}
</script></body></html>
